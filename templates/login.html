
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - TalentMatch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            margin: 0;
            color: #243047;
        }
        header {
            background: #17365d;
            color: white;
            padding: 22px;
            text-align: center;
        }
        .container {
            max-width: 420px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #00000015;
        }
        h2 {
            text-align: center;
            color: #17365d;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccd3df;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #244b78;
        }
        .message {
            color: #b42318;
            text-align: center;
        }
        .link {
            text-align: center;
            margin-top: 20px;
        }
        a {
            color: #244b78;
        }
    </style>
</head>
<body>

<header>
    <h1>TalentMatch</h1>
    <p>Intelligent Job Matching System</p>
</header>

<div class="container">
    <h2>Login</h2>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form action="/login" method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Login as</label>
        <select name="role" required>
            <option value="candidate">Candidate</option>
            <option value="recruiter">Recruiter</option>
        </select>

        <button type="submit">Login</button>
    </form>

    <div class="link">
        Don't have an account?
        <a href="/register">Register here</a>
    </div>
</div>

</body>
</html>
